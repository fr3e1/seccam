<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b26">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <title>SecCam: welcome</title>
  <script type="module" src="/static/js/welcome.js"></script>
</head>
<body>
  <main class="page-center">
    <div class="term term-wide">
      <div class="term-bar">seccam:~$ setup</div>
      <div class="term-body">
        <div class="steps" id="steps">
          <span data-dot="1">1 token</span><span data-dot="2">2 account</span><span data-dot="3">3 detection</span><span data-dot="4">4 theme</span>
        </div>
        <form id="setup-form" novalidate>
          <section data-step="1">
            <div class="field hidden" id="cred-choice">
              <div class="option-group">
                <label class="check"><input type="radio" name="cred" value="token" checked> setup token</label>
                <label class="check"><input type="radio" name="cred" value="pin"> legacy PIN (v1 upgrade)</label>
              </div>
            </div>
            <label class="field">
              <span class="field-label" id="cred-label">setup token</span>
              <input class="input" id="credential" name="credential" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
              <span class="field-hint" id="cred-hint">Token is in &lt;data_dir&gt;/setup-token or the service log.</span>
            </label>
          </section>
          <section data-step="2" class="hidden">
            <label class="field">
              <span class="field-label">username</span>
              <input class="input" id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32">
              <span class="field-hint">3-32 chars: letters, digits, _ . -</span>
            </label>
            <label class="field">
              <span class="field-label">password</span>
              <input class="input" id="password" type="password" autocomplete="new-password">
              <span class="field-hint">At least 10 characters.</span>
            </label>
            <label class="field">
              <span class="field-label">confirm password</span>
              <input class="input" id="password-confirm" type="password" autocomplete="new-password">
            </label>
          </section>
          <section data-step="3" class="hidden">
            <fieldset class="field">
              <legend class="field-label">labels to detect</legend>
              <div class="label-grid" id="labels"></div>
            </fieldset>
            <label class="field">
              <span class="field-label">keep events for</span>
              <select class="select" id="retention">
                <option value="3">3 days</option>
                <option value="7">7 days</option>
                <option value="14" selected>14 days</option>
                <option value="30">30 days</option>
                <option value="90">90 days</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">detection mode</span>
              <select class="select" id="mode">
                <option value="auto" selected>auto (device first, server fallback)</option>
                <option value="local">on-device</option>
                <option value="server">server</option>
              </select>
            </label>
          </section>
          <section data-step="4" class="hidden">
            <p class="muted">Pick a theme. It applies immediately; you can change it later in Settings.</p>
            <div class="theme-list" id="themes"></div>
          </section>
          <p class="error-text" id="error" role="alert" aria-live="assertive"></p>
          <div class="actions">
            <button class="btn btn-ghost" id="back" type="button">Back</button>
            <button class="btn btn-primary" id="next" type="submit">Next</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
