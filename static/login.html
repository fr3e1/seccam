<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b26">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <title>SecCam: sign in</title>
  <script type="module" src="/static/js/login.js"></script>
</head>
<body>
  <main class="page-center">
    <div class="term">
      <div class="term-bar">seccam:~$ login</div>
      <div class="term-body">
        <form id="login-form" novalidate>
          <label class="field">
            <span class="field-label">username</span>
            <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </label>
          <label class="field">
            <span class="field-label">password</span>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <label class="field hidden" id="totp-field">
            <span class="field-label">2FA code or recovery code</span>
            <input class="input" id="totp" name="totp" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="16">
          </label>
          <p class="error-text" id="error" role="alert" aria-live="assertive"></p>
          <button class="btn btn-primary" id="submit" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
