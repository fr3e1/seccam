<!DOCTYPE html>
<html lang="en" data-theme="tokyo-night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1b26">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <script src="/static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>SecCam</title>
  <script type="module" src="/static/js/viewer.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand prompt">seccam</span>
    <span class="badge" id="conn">offline</span>
    <span class="grow"></span>
    <button class="btn btn-ghost btn-sm" id="notif-btn" type="button" aria-pressed="false">notify: off</button>
    <button class="btn btn-ghost btn-sm" id="beep-btn" type="button" aria-pressed="false">beep: off</button>
    <button class="btn btn-ghost btn-sm" id="cam-btn" type="button">+ camera</button>
    <button class="btn btn-ghost btn-sm" id="settings-btn" type="button" aria-controls="settings-drawer" aria-expanded="false">settings</button>
    <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">sign out</button>
  </header>

  <main class="dash">
    <section class="camera-grid" id="camera-grid" aria-label="Live cameras">
      <p class="muted grid-empty" id="grid-empty">No cameras connected. Use "+ camera" to pair one.</p>
    </section>

    <aside class="side" aria-label="Events">
      <div class="term">
        <div class="term-bar">events</div>
        <div class="term-body events-body">
          <div class="row wrap filters" id="filters" role="group" aria-label="Filter events by label"></div>
          <div class="events" id="events" role="feed" aria-label="Event timeline"></div>
          <button class="btn btn-ghost btn-sm" id="more-btn" type="button">load more</button>
        </div>
      </div>
      <div class="card stats" id="stats" aria-label="Statistics"></div>
    </aside>
  </main>

  <div class="scrim hidden" id="scrim"></div>
  <aside class="drawer" id="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="settings-title" class="prompt">settings</h2>
      <button class="btn btn-ghost btn-sm" id="settings-close" type="button" aria-label="Close settings">close</button>
    </div>
    <div class="drawer-body">
      <div class="tabs" id="settings-tabs" role="tablist"></div>
      <div id="settings-panel"></div>
    </div>
  </aside>

  <div class="modal-backdrop" id="event-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="event-title">
      <h2 id="event-title" class="prompt">event</h2>
      <img class="event-image" id="event-image" alt="Event snapshot">
      <dl class="event-details" id="event-details"></dl>
      <div class="row wrap">
        <button class="btn btn-danger" id="event-delete" type="button">delete</button>
        <span class="grow"></span>
        <button class="btn btn-ghost" id="event-close" type="button">close</button>
      </div>
    </div>
  </div>
</body>
</html>
