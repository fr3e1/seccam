name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          pytest -q --timeout 60
          node --test tests/js/*.test.mjs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TAG" != "v$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Tag $TAG does not match VERSION file" >&2
            exit 1
          fi
      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/make-release.sh "${TAG#v}" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
